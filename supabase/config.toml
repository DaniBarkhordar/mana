# Supabase CLI project settings. `supabase link --project-ref <ref>` fills in
# the rest; these are the parts the code depends on.

[functions.identify-food]
# Called by the app with the user's session JWT; the function checks it.
verify_jwt = true

[functions.revenuecat-webhook]
# Called by RevenueCat with a shared secret, not a user JWT (runbook §3b).
verify_jwt = false

[auth]
# The diary syncs under an anonymous user from first launch (runbook §3).
enable_anonymous_sign_ins = true

name: mananu
description: Mananu — weigh it, don't guess it. Body composition and food logging
  built around a scale rather than a camera.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod over Bloc here: the app is mostly streams (a live weight, a
  # day's log) and Riverpod's StreamProvider maps onto that with far less
  # ceremony.
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend. EU region — see docs/04-compliance-uk.md.
  supabase_flutter: ^2.5.6

  # Local-first. Every log works offline and syncs later; a food diary that
  # needs signal is a food diary people abandon.
  drift: ^2.18.0
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # The vendor's own Flutter plugin for the Shenzhen Unique Scales (Lefu)
  # hardware, vendored so the build is reproducible (docs/10-sdk.md). The
  # driver only initialises it when LEFU_APP_KEY / LEFU_APP_SECRET are passed
  # at build time and assets/lefu.config is present; otherwise the app runs on
  # the simulated scale.
  pp_bluetooth_kit_flutter:
    path: ../vendor/pp_bluetooth_kit_flutter

  # Independent BLE path, so the app is not hostage to a vendor licence blob.
  flutter_blue_plus: ^1.32.7
  permission_handler: ^11.3.1

  # Photo identification: the system camera UI is enough, and it is one
  # permission prompt rather than a custom viewfinder to maintain.
  image_picker: ^1.1.2
  # Downscales the photo to 512 px on device before upload (cost control).
  image: ^4.2.0
  mobile_scanner: ^5.1.1

  # Open Food Facts lookups. The client sets the User-Agent and paces calls.
  http: ^1.2.0

  fl_chart: ^0.68.0
  intl: ^0.19.0
  collection: ^1.18.0

  # Client-generated primary keys, so a row created offline keeps its identity
  # when it reaches the server.
  uuid: ^4.5.1

  purchases_flutter: ^6.29.3
  health: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/food/
    - assets/brand/

# Launcher icons from the brand monogram (brand/mananu-monogram.svg rendered
# to PNG). Run after changing them: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/icon-1024.png
  adaptive_icon_background: "#0D1012"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  adaptive_icon_monochrome: assets/brand/icon-foreground.png
